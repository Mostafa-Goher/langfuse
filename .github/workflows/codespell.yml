---
name: Codespell

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  merge_group:

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
